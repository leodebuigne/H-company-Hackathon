[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pilote-orchestrator"
version = "0.1.0"
description = "Pilote : orchestrateur (FastAPI), agent H et IA Hugging Face"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Membre 1 (orchestrator/agent_h). Ajouts : issue ou PR, validée par le membre 5.
agent = [
  "hai-agents[cli,browser]",
  "upstash-redis>=1.1",
]
# Membre 2 (orchestrator/ai). Ajouts : issue ou PR, validée par le membre 5.
ai = [
  "huggingface_hub>=0.25",
  "openai>=1.40",
  "gradio_client>=1.3",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "jsonschema[format]>=4.23",
]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["orchestrator"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

# Consignes et descriptions d'outils lues par le modèle : on ne coupe pas ces lignes.
[tool.ruff.lint.per-file-ignores]
"orchestrator/agent_h/prompts.py" = ["E501"]
"orchestrator/agent_h/agent.py" = ["E501"]
"orchestrator/agent_h/metrics.py" = ["E501"]
