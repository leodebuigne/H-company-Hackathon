name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web (lint + types + tests + contrats)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm 10 (livré avec Node 22) plante sur l'arbre de dépendances d'eslint-config-next
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
