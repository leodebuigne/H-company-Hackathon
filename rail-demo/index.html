<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rail Démo – Rechercher un train (site fictif)</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body data-page="index">
<div class="fictif" role="note">Site fictif de démonstration : aucun vrai billet n'est vendu, aucun paiement réel.</div>
<header class="site"><a href="index.html">Rail Démo</a></header>
<main>
<h1>Rechercher un train</h1>
<p class="sous-titre">Choisissez votre trajet, la date et l'heure de départ.</p>
<form class="recherche" id="recherche" action="resultats.html" method="get">
  <label>Gare de départ <select id="de" name="de"></select></label>
  <label>Gare d'arrivée <select id="a" name="a"></select></label>
  <label>Date du voyage <input type="date" id="date" name="date" required></label>
  <label>Départ à partir de <select id="heure" name="heure"></select></label>
  <input type="hidden" id="scenario" name="scenario" value="">
  <p id="message" class="plein alerte-texte" role="alert"></p>
  <div class="plein"><button type="submit" class="btn primaire">Rechercher</button></div>
</form>
</main>
<footer>Rail Démo · projet de hackathon · données entièrement fictives</footer>
</body>
</html>
